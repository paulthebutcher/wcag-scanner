<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Keyboard sweep with third-party embeds</title>
  <style>a { display: block; margin: 6px; } iframe { display: block; }</style>
</head>
<!--
  Shape of a Popfly blog post (P2-034): the page's own links around an
  Instagram reel iframe and an Instagram blockquote embed with its own links.
  The test server serves /vendor/instagram.com/embed for the iframe, so its
  src contains "instagram.com" and matches the vendor pattern.
-->
<body>
  <nav><a id="l1" href="/one">One</a></nav>
  <div class="post-embed"><iframe src="/vendor/instagram.com/embed" title="Instagram post" width="300" height="80"></iframe></div>
  <a id="l2" href="/two">Two</a>
  <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/p/x/">
    <a href="https://www.instagram.com/p/x/">A post</a>
    <div><a href="https://www.instagram.com/u/">by a user</a></div>
    <a href="https://www.instagram.com/p/x/?taken-by=u">View on Instagram</a>
  </blockquote>
  <a id="l3" href="/three">Three</a>
  <a id="l4" href="/four">Four</a>
</body>
</html>
