<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Smooth scroll focus order fixture</title>
  <style>
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: sans-serif; }
    .spacer { height: 350px; }
    a, button { display: inline-block; margin: 8px; }
    .row { display: flex; gap: 24px; }
  </style>
</head>
<body>
  <!-- DOM order equals visual order; every section sits beyond the first viewport,
       so each Tab starts a smooth scroll. A viewport-relative reading mid-scroll
       sees the next control above the previous one; page coordinates do not. -->
  <main>
    <h1>Smooth scroll</h1>
    <a id="l1" href="#a">first</a>
    <div class="spacer"></div>
    <a id="l2" href="#b">second</a>
    <div class="spacer"></div>
    <div class="row"><button id="b1" type="button">row one</button><button id="b2" type="button">row two</button></div>
    <div class="spacer"></div>
    <a id="l3" href="#c">third</a>
    <div class="spacer"></div>
    <a id="l4" href="#d">fourth</a>
    <div class="spacer"></div>
    <a id="l5" href="#e">fifth</a>
    <div class="spacer"></div>
    <a id="l6" href="#f">sixth</a>
  </main>
</body>
</html>
