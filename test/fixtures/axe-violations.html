<!DOCTYPE html>
<html>
<!-- Intentionally missing lang attribute (WCAG 3.1.1) -->
<head>
  <meta charset="UTF-8">
  <title>axe-core Test Fixture — Known Violations</title>
</head>
<body>
  <!-- Missing alt text on image (WCAG 1.1.1) -->
  <img src="photo.jpg">

  <!-- Low contrast text (WCAG 1.4.3) -->
  <p style="color: #aaaaaa; background-color: #ffffff;">Low contrast text</p>

  <!-- Empty link (WCAG 2.4.4 / 4.1.2) -->
  <a href="/about"></a>

  <!-- Form input without label (WCAG 1.3.1 / 4.1.2) -->

  <!-- Valid elements (should pass) -->
  <h1>Page Title</h1>
  <p>Normal paragraph with sufficient contrast.</p>
  <a href="/contact">Contact Us</a>
  <img src="logo.png" alt="Company Logo">
</body>
</html>
