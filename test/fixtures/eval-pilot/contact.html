<!DOCTYPE html>

  <title>Contact Pilot Parks</title>

<body class="body">
  <a href="#main-content" class="skip-link">Skip to content</a>
  <div class="w-nav navbar" role="banner">
    <a href="/" class="w-nav-brand"><img src="/images/logo.png" alt="Pilot Parks" class="brand-image"></a>
    <nav class="w-nav-menu">
      <a href="/" class="w-nav-link">Home</a>
      <a href="/about" class="w-nav-link">About</a>
      <a href="/contact" class="w-nav-link w--current">Contact</a>
    </nav>
  </div>
  <main id="main-content" class="main">
    <h1>Contact the parks office</h1>
    <div class="w-form">
      <form id="contact-form" name="contact" data-name="Contact" method="post" action="/api/contact-native" class="contact-form" novalidate>
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" class="w-input" required>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" class="w-input" required>
        <label for="message">Message</label>
        <textarea id="message" name="message" class="w-input" required></textarea>
        <div id="form-errors" class="form-errors"></div>
        <canvas id="submit-noise" width="48" height="8" aria-hidden="true"></canvas>
        <button type="submit" class="w-button">Send</button>
      </form>
    </div>

    <h2>Newsletter</h2>
    <form id="newsletter" class="newsletter-form">
      <label for="nl-email">Your email</label>
      <input id="nl-email" name="nl-email" type="email" required>
      <button type="submit">Subscribe</button>
      <p class="nl-status" aria-live="polite"></p>
    </form>

    <h2>Request a printed map</h2>
    <form id="legacy" action="/api/legacy-post" method="post" class="legacy-form">
      <label for="addr">Mailing address</label>
      <input id="addr" name="addr" type="text" required>
      <button type="submit">Request</button>
    </form>
  </main>
  <script src="/js/site.js"></script>
