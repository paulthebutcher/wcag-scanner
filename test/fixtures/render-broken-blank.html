<script>
(function () {
  function initializeSkipLink() {
    if (document.querySelector(".skip-link")) return;
    const header = document.querySelector(".header-wrapper");
    const target = document.getElementById("main-content") || (header && header.nextElementSibling) || document.querySelector("section");
    if (!target) return;
    if (!target.id) target.id = "main-content";
    target.setAttribute("tabindex", "-1");
    const link = document.createElement("a");
    link.className = "skip-link";
    link.href = "#" + target.id;
    link.textContent = "Skip to main content";
    document.body.insertBefore(link, document.body.firstChild);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initializeSkipLink);
  else initializeSkipLink();
})();
</script>
